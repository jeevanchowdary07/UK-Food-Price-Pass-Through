name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  reproduce-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate configuration
        run: python scripts/00_validate_environment.py

      - name: Reproduce statistical analysis
        run: python scripts/03_reproduce_final_analysis.py

      - name: Rebuild figures
        run: python scripts/04_make_figures.py

      - name: Verify reported headline results
        run: python scripts/05_verify_reported_results.py

      - name: Run research-integrity tests
        run: pytest -q
